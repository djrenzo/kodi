name: Deploy Kodi Repo to GitHub Pages

on:
  workflow_run:
    workflows: ["Build Kodi Addon"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if build workflow failed
        if: github.event.workflow_run.conclusion == 'failure'
        run: echo "Build workflow failed, skipping deploy." && exit 0

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout or create gh-pages branch
        run: |
          GH_PAGES="${{ github.workspace }}/../gh-pages"
          cd main
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages
            git worktree add "$GH_PAGES" gh-pages
          else
            echo "gh-pages branch not found, creating it fresh."
            mkdir -p "$GH_PAGES"
            cd "$GH_PAGES"
            git init
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan gh-pages
            git commit --allow-empty -m "Initial gh-pages commit"
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

      - name: Fetch all addon releases and build addons.xml
        run: |
          REPO="${{ github.repository }}"
          GH_PAGES="${{ github.workspace }}/../gh-pages"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > addons.xml
          echo '<addons>' >> addons.xml

          for ADDON_DIR in main/addons/*/; do
            if [ ! -f "${ADDON_DIR}addon.xml" ]; then
              echo "Skipping $(basename $ADDON_DIR): no addon.xml found."
              continue
            fi

            ADDON_ID=$(python3 -c "import xml.etree.ElementTree as ET; t=ET.parse('${ADDON_DIR}addon.xml'); print(t.getroot().get('id'))")
            VERSION=$(python3 -c "import xml.etree.ElementTree as ET; t=ET.parse('${ADDON_DIR}addon.xml'); print(t.getroot().get('version'))")
            ZIP_NAME="${ADDON_ID}-${VERSION}.zip"
            TAG="${ADDON_ID}-v${VERSION}"

            echo "Processing $ADDON_ID v$VERSION..."

            RELEASE_DATA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG")

            DOWNLOAD_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n 1)

            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
              echo "Warning: No release found for $TAG, skipping."
              continue
            fi

            mkdir -p "$GH_PAGES/$ADDON_ID"
            curl -sL "$DOWNLOAD_URL" -o "$GH_PAGES/$ADDON_ID/$ZIP_NAME"
            cp "${ADDON_DIR}addon.xml" "$GH_PAGES/$ADDON_ID/addon.xml"
            [ -f "${ADDON_DIR}icon.png" ]   && cp "${ADDON_DIR}icon.png"   "$GH_PAGES/$ADDON_ID/icon.png"
            [ -f "${ADDON_DIR}fanart.jpg" ] && cp "${ADDON_DIR}fanart.jpg" "$GH_PAGES/$ADDON_ID/fanart.jpg"

            grep -v '<?xml' "${ADDON_DIR}addon.xml" >> addons.xml
          done

          echo '</addons>' >> addons.xml
          md5sum addons.xml | cut -d' ' -f1 > addons.xml.md5
          mv addons.xml "$GH_PAGES/addons.xml"
          mv addons.xml.md5 "$GH_PAGES/addons.xml.md5"

      - name: Generate repository installer zip and index.html
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          GH_PAGES_PATH: ${{ github.workspace }}/../gh-pages
        run: |
          python3 - << 'EOF'
import os, zipfile

owner = os.environ["REPO_OWNER"].lower()
repo  = os.environ["REPO_NAME"]
pages = os.environ["GH_PAGES_PATH"]
url   = f"https://{owner}.github.io/{repo}"

addon_xml = f"""<?xml version="1.0" encoding="UTF-8"?>
<addon id="repository.djrenzo" version="1.0.0" name="DJRenzo Repository" provider-name="djrenzo">
  <extension point="xbmc.addon.repository" name="DJRenzo Repository">
    <info compressed="false">{url}/addons.xml</info>
    <checksum>{url}/addons.xml.md5</checksum>
    <datadir zip="true">{url}/</datadir>
  </extension>
  <extension point="xbmc.addon.metadata">
    <summary>DJRenzo Kodi Repository</summary>
    <description>Personal Kodi repository by DJRenzo</description>
    <platform>all</platform>
  </extension>
</addon>"""

zip_path = os.path.join(pages, "repository.djrenzo-1.0.0.zip")
with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as z:
    z.writestr("repository.djrenzo/addon.xml", addon_xml)

index_html = f"""<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJRenzo Kodi Repo</title>
  <style>
    body {{ font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }}
    code {{ background: #f4f4f4; padding: 4px 8px; border-radius: 4px; word-break: break-all; }}
    ol {{ line-height: 2; }}
  </style>
</head>
<body>
  <h1>DJRenzo Kodi Repository</h1>
  <h2>How to install</h2>
  <ol>
    <li>In Kodi go to <strong>Settings &rarr; System &rarr; Add-ons</strong> and enable <strong>Unknown sources</strong></li>
    <li>Go to <strong>Settings &rarr; File Manager &rarr; Add Source</strong></li>
    <li>Enter this URL: <code>{url}</code> and give it a name</li>
    <li>Go to <strong>Add-ons &rarr; Install from zip file</strong>, select the source you just added</li>
    <li>Install <code>repository.djrenzo-1.0.0.zip</code></li>
    <li>Go to <strong>Add-ons &rarr; Install from repository &rarr; DJRenzo Repository</strong> and install your addons</li>
  </ol>
</body>
</html>"""

with open(os.path.join(pages, "index.html"), "w") as f:
    f.write(index_html)

print("Generated repository.djrenzo-1.0.0.zip and index.html")
EOF

      - name: Commit and push gh-pages
        run: |
          cd ${{ github.workspace }}/../gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy Kodi repo: updated addons.xml and zips"
            git push --set-upstream origin gh-pages
          fi
