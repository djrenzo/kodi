name: Deploy Kodi Repo to GitHub Pages

on:
  workflow_run:
    workflows: ["Build Kodi Addon"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if build workflow failed
        if: github.event.workflow_run.conclusion == 'failure'
        run: echo "Build workflow failed, skipping deploy." && exit 0

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout or create gh-pages branch
        run: |
          GH_PAGES="${{ github.workspace }}/../gh-pages"
          cd main
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages
            git worktree add "$GH_PAGES" gh-pages
          else
            echo "gh-pages branch not found, creating it fresh."
            mkdir -p "$GH_PAGES"
            cd "$GH_PAGES"
            git init
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan gh-pages
            git commit --allow-empty -m "Initial gh-pages commit"
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

      - name: Fetch all addon releases and build addons.xml
        run: |
          REPO="${{ github.repository }}"
          GH_PAGES="${{ github.workspace }}/../gh-pages"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > addons.xml
          echo '<addons>' >> addons.xml

          for ADDON_DIR in main/addons/*/; do
            if [ ! -f "${ADDON_DIR}addon.xml" ]; then
              echo "Skipping $(basename $ADDON_DIR): no addon.xml found."
              continue
            fi

            ADDON_ID=$(python3 -c "import xml.etree.ElementTree as ET; t=ET.parse('${ADDON_DIR}addon.xml'); print(t.getroot().get('id'))")
            VERSION=$(python3 -c "import xml.etree.ElementTree as ET; t=ET.parse('${ADDON_DIR}addon.xml'); print(t.getroot().get('version'))")
            ZIP_NAME="${ADDON_ID}-${VERSION}.zip"
            TAG="${ADDON_ID}-v${VERSION}"

            echo "Processing $ADDON_ID v$VERSION..."

            # repository.djrenzo is not a released addon — zip it directly from source
            if [ "$ADDON_ID" == "repository.djrenzo" ]; then
              mkdir -p "$GH_PAGES/$ADDON_ID"
              cd main/addons
              zip -r "$GH_PAGES/${ADDON_ID}-${VERSION}.zip" "$ADDON_ID/"
              cd "${{ github.workspace }}"
              cp "${ADDON_DIR}addon.xml" "$GH_PAGES/$ADDON_ID/addon.xml"
              [ -f "${ADDON_DIR}icon.png" ]   && cp "${ADDON_DIR}icon.png"   "$GH_PAGES/$ADDON_ID/icon.png"
              [ -f "${ADDON_DIR}fanart.jpg" ] && cp "${ADDON_DIR}fanart.jpg" "$GH_PAGES/$ADDON_ID/fanart.jpg"
              grep -v '<?xml' "${ADDON_DIR}addon.xml" >> addons.xml
              continue
            fi

            RELEASE_DATA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG")

            DOWNLOAD_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n 1)

            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
              echo "Warning: No release found for $TAG, skipping."
              continue
            fi

            mkdir -p "$GH_PAGES/$ADDON_ID"
            curl -sL "$DOWNLOAD_URL" -o "$GH_PAGES/$ADDON_ID/$ZIP_NAME"
            cp "${ADDON_DIR}addon.xml" "$GH_PAGES/$ADDON_ID/addon.xml"
            [ -f "${ADDON_DIR}icon.png" ]   && cp "${ADDON_DIR}icon.png"   "$GH_PAGES/$ADDON_ID/icon.png"
            [ -f "${ADDON_DIR}fanart.jpg" ] && cp "${ADDON_DIR}fanart.jpg" "$GH_PAGES/$ADDON_ID/fanart.jpg"

            grep -v '<?xml' "${ADDON_DIR}addon.xml" >> addons.xml
          done

          echo '</addons>' >> addons.xml
          md5sum addons.xml | cut -d' ' -f1 > addons.xml.md5
          mv addons.xml "$GH_PAGES/addons.xml"
          mv addons.xml.md5 "$GH_PAGES/addons.xml.md5"

      - name: Generate index.html
        run: |
          GH_PAGES="${{ github.workspace }}/../gh-pages"
          cat > "$GH_PAGES/index.html" << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>DJRenzo Kodi Repo</title>
          </head>
          <body>
            <a href="repository.djrenzo-1.0.0.zip">repository.djrenzo-1.0.0.zip</a>
          </body>
          </html>
          HTML

      - name: Commit and push gh-pages
        run: |
          cd ${{ github.workspace }}/../gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy Kodi repo: updated addons.xml and zips"
            git push --set-upstream origin gh-pages
          fi